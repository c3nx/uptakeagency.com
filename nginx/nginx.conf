# www -> apex kalıcı yönlendirme; tek kanonik host
server {
    listen 80;
    server_name www.uptakeagency.com;
    return 301 https://uptakeagency.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # connect-src: Formspree (iletisim formu fetch), Plausible + Cloudflare Insights (analytics event)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://formspree.io https://plausible.io https://cloudflareinsights.com" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Astro statik çıktı yönlendirmesi; olmayan sayfa gerçek 404 döner (soft-404 yok)
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Cache static assets
    location ~* \.(png|jpg|jpeg|webp|svg|ico|gif|woff2|woff|ttf|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache HTML with short TTL for updates
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Gizli dosyaları engelle; .well-known meşru, açık kalmalı
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
